# Example: CAPZ (Azure) with Crossplane-managed storage and Workload Identity.
#
# Loki authenticates to Blob storage with a federated token (Azure Workload Identity)
# instead of a static storage account key. See "Using Azure Workload Identity instead of
# a storage account key" in the README for what gets created and how it fits together.
#
# Prerequisites on the cluster (all present on Giant Swarm CAPZ management clusters):
#   - the Azure Workload Identity webhook (giantswarm/azure-workload-identity-webhook-app)
#   - provider-kubernetes with an in-cluster ProviderConfig
#   - the ClusterRole/binding shipped by this chart (templates/crossplane/azure/rbac.yaml)

crossplane:
  enabled: true
  provider: azure
  region: westeurope
  clusterName: "my-installation"  # MUST match your AzureCluster CR name
  resourceGroup: "my-installation"
  azure:
    enabled: true
    resourceGroup: "my-installation"
    container:
      name: giantswarm-my-installation-loki
    workloadIdentity:
      enabled: true
      # oidcIssuerUrl is auto-detected from the cluster's kube-apiserver
      # --service-account-issuer (kube-system/kubeadm-config). Set it explicitly
      # only on non-kubeadm clusters where auto-detection cannot find it:
      # oidcIssuerUrl: "https://oidcissuerXXXXXXXX.blob.core.windows.net/oidc-test/"
      roleDefinitionName: "Storage Blob Data Contributor"
      # Defaults shown; override only if your provider-kubernetes differs.
      providerKubernetes:
        providerConfigRef: in-cluster
        serviceAccount:
          name: upbound-contrib-provider-kubernetes
          namespace: crossplane

loki:
  # Applies to the loki pods (read/write/backend) only — the gateway and memcached
  # never talk to object storage. The label makes the webhook inject the projected
  # federated token, AZURE_FEDERATED_TOKEN_FILE and AZURE_AUTHORITY_HOST; the secret
  # refs carry the identity's generated clientId/tenantId, which Crossplane bridges
  # into the `loki-azure-identity` secret (the webhook never overrides an env var that
  # is already set). Optional refs, so pods still start while the identity reconciles.
  defaults:
    podLabels:
      azure.workload.identity/use: "true"
    extraEnv:
      - name: AZURE_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: loki-azure-identity
            key: AZURE_CLIENT_ID
            optional: true
      - name: AZURE_TENANT_ID
        valueFrom:
          secretKeyRef:
            name: loki-azure-identity
            key: AZURE_TENANT_ID
            optional: true

  loki:
    storage:
      type: azure
      # 'Blob service' 'Container' name. Sharing one container for all three is the
      # convention in this repo (see values-capz-crossplane.yaml): Loki keeps chunks,
      # index and rules apart by object prefix.
      bucketNames:
        chunks: giantswarm-my-installation-loki
        ruler: giantswarm-my-installation-loki
        admin: giantswarm-my-installation-loki
      azure:
        # 'Storage account' name (sanitized container name, max 24 chars)
        accountName: ""
        # No accountKey — authentication uses the federated token.
        useFederatedToken: true
