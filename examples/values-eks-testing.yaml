global:
  # For imported EKS clusters only. Remove this for CAPI EKS clusters.
  dnsService: "kube-dns"

ciliumNetworkPolicy:
  # For imported EKS clusters: false. For CAPI EKS clusters: true.
  enabled: false

loki:
  ruler:
    enabled: false
  networkPolicy:
    # Loki pods need to reach the loki-memberlist service for discovery.
    discovery:
      port: 7946
      namespaceSelector:
        name: kube-system
  loki:
    compactor:
      retention_enabled: true
      delete_request_store: s3
    storage:
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin
      type: s3
      object_store:
        type: s3
        s3:
          # The RustFS service from extraObjects below.
          endpoint: rustfs:9000
          secret_access_key: rustfsadmin
          access_key_id: rustfsadmin
          insecure: true
  # Object storage mocking: a single RustFS pod with ephemeral storage.
  extraObjects:
    - apiVersion: v1
      kind: Service
      metadata:
        name: rustfs
      spec:
        selector:
          app: rustfs
        ports:
          - name: http
            port: 9000
            targetPort: 9000
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rustfs
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: rustfs
        template:
          metadata:
            labels:
              app: rustfs
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              fsGroup: 10001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: rustfs
                image: docker.io/rustfs/rustfs:1.0.4
                ports:
                  - containerPort: 9000
                    name: http
                env:
                  - name: RUSTFS_ACCESS_KEY
                    value: rustfsadmin
                  - name: RUSTFS_SECRET_KEY
                    value: rustfsadmin
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                volumeMounts:
                  - name: data
                    mountPath: /data
                readinessProbe:
                  httpGet:
                    path: /health
                    port: http
                  periodSeconds: 10
                # RustFS serves each top-level directory of /data as a bucket.
                startupProbe:
                  exec:
                    command:
                      - mkdir
                      - -p
                      - /data/chunks/
                      - /data/ruler/
                      - /data/admin/
                  initialDelaySeconds: 1
                  periodSeconds: 1
                  failureThreshold: 10
            volumes:
              - name: data
                emptyDir: {}

  ## When using Crossplane storage provisioning with IAM, uncomment and configure:
  # serviceAccount:
  #   annotations:
  #     eks.amazonaws.com/role-arn: "arn:aws:iam::${AWS_ACCOUNT_ID}:role/giantswarm-my-cluster-loki-storage"

  gateway:
    replicas: 3
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-giantswarm
      hosts:
        - host: loki.loki.sample-customer.gaws.gigantic.io
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - loki.loki.sample-customer.gaws.gigantic.io
          secretName: loki-ingress-cert
